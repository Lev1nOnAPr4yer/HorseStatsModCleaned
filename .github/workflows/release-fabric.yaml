name: release fabric
on:
  push:
    tags:
      # https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#filter-pattern-cheat-sheet
      # Examples: 3.5.0-MC26.2-fabric, 3.4.0-MC1.21.11-fabric
      - "[0-9]+.[0-9]+.[0-9]+-MC[0-9]+.[0-9x]+-fabric"
      - "[0-9]+.[0-9]+.[0-9]+-MC[0-9]+.[0-9]+.[0-9x]+-fabric"
  # Can also be started from the Actions tab: the tag is created from gradle.properties, e.g. 3.7.0-MC26.3-fabric
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Gradle Build
        run: ./gradlew build
      - name: Read project metadata
        id: project
        shell: bash
        run: |
          minecraft_version=$(sed -n 's/^minecraft_version=//p' gradle.properties)
          echo "minecraft_version=$minecraft_version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$(sed -n 's/^version=//p' gradle.properties)-MC$minecraft_version-fabric" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish
        uses: Kira-NT/mc-publish@v3
        with:
          # Only publishes a GitHub release on this repository, with the mod jar attached
          github-token: ${{ secrets.GITHUB_TOKEN }}
          github-files: build/libs/!(*-@(dev|sources|javadoc)).jar
          github-tag: ${{ steps.project.outputs.tag }}
          github-commitish: ${{ github.sha }}

          files: build/libs/!(*-@(dev|sources|javadoc)).jar
          name: Horse Statistics ${{ steps.project.outputs.tag }}
          version: ${{ steps.project.outputs.tag }}
          version-type: release
          changelog-file: CHANGELOG_FABRIC.md
          loaders: fabric
          environment: client
          game-versions: ${{ steps.project.outputs.minecraft_version }}
