plugins {
    id 'net.fabricmc.fabric-loom' version '1.16-SNAPSHOT'
}

base {
    archivesName = "${mod_id}-fabric-${minecraft_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version as int)
    withSourcesJar()
    withJavadocJar()
}

repositories {
    mavenCentral()
    maven { url 'https://maven.shedaniel.me/' }       // cloth config
    maven { url 'https://maven.terraformersmc.com/releases/' }  // mod menu
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    implementation("me.shedaniel.cloth:cloth-config-fabric:${fabric_cloth_config_version}") {
        exclude(group: 'net.fabricmc.fabric-api')
    }
    implementation "com.terraformersmc:modmenu:${fabric_modmenu_version}"
    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

loom {
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
    }
}

sourcesJar {
    from(rootProject.file('LICENSE')) {
        rename { "${it}_${mod_name}" }
    }
}

jar {
    from(rootProject.file('LICENSE')) {
        rename { "${it}_${mod_name}" }
    }

    manifest {
        attributes([
                'Specification-Title'   : mod_name,
                'Specification-Vendor'  : mod_author,
                'Specification-Version' : project.jar.archiveVersion,
                'Implementation-Title'  : project.name,
                'Implementation-Version': project.jar.archiveVersion,
                'Implementation-Vendor' : mod_author,
                'Built-On-Minecraft'    : minecraft_version
        ])
    }
}

processResources {
    var expandProps = [
            'version'                    : version,
            'minecraft_version_range'    : minecraft_version_range,
            'fabric_version'             : fabric_version,
            'fabric_loader_version'      : fabric_loader_version,
            'fabric_cloth_config_version': fabric_cloth_config_version,
            'mod_name'                   : mod_name,
            'mod_author'                 : mod_author,
            'mod_id'                     : mod_id,
            'license'                    : license,
            'description'                : project.description,
            'java_version'               : java_version,
            'mod_display_url'            : mod_display_url,
            'mod_issue_tracker'          : mod_issue_tracker,
    ]

    var jsonExpandProps = expandProps.collectEntries {
        key, value -> [(key): value instanceof String ? value.replace('\n', '\\\\n') : value]
    }

    filesMatching(['fabric.mod.json', '*.mixins.json']) {
        expand jsonExpandProps
    }

    inputs.properties(expandProps)
}
